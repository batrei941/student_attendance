
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #1565c0,
                    #42a5f5,
                    #90caf9
                );

            font-family: "Segoe UI", Arial, sans-serif;
        }

        .success-card {
            width: 90%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.20);
        }

        .success-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e8f5e9;

            color: #2e7d32;

            border-radius: 50%;

            font-size: 40px;
        }

        .success-card h3 {
            color: #1565c0;
            font-weight: 700;

            margin-bottom: 10px;
        }

        .success-card p {
            color: #666;

            margin-bottom: 25px;
        }

        .btn-yes {
            background: #1565c0;
            color: white;

            padding: 10px 25px;

            border-radius: 8px;

            border: none;
        }

        .btn-yes:hover {
            background: #0d47a1;
            color: white;
        }

        .btn-no {
            background: #6c757d;
            color: white;

            padding: 10px 25px;

            border-radius: 8px;

            border: none;
        }

        .btn-no:hover {
            background: #495057;
            color: white;
        }

    </style>

</head>

<body>

<div class="success-card">

    <div class="success-icon">
        <i class="bi bi-check-circle-fill"></i>
    </div>

    <h3>Registration Successful!</h3>

    <p>
        Student <strong>{{ name }}</strong> has been successfully registered.
    </p>

    <p>
        Do you want to add another student?
    </p>

    <div class="d-flex justify-content-center gap-3">

        <!-- YES -->
        <button
            type="button"
            class="btn btn-yes"
            onclick="addMoreStudent()">

            <i class="bi bi-person-plus-fill"></i>
            Yes

        </button>

        <!-- NO -->
        <button
            type="button"
            class="btn btn-no"
            onclick="goToDashboard()">

            <i class="bi bi-speedometer2"></i>
            No

        </button>

    </div>

</div>


<script>

function addMoreStudent() {

    // Go back to student registration page
    window.location.href = "/register";

}


function goToDashboard() {

    // Go to dashboard
    window.location.href = "/student_record";

}

</script>


</body>

</html>
