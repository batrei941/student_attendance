<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9 col-sm-12">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i>
                        Edit Student
                    </h4>
                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        <!-- Student Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Student Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                value="{{ student[1] }}"
                                required
                            >
                        </div>

                        <!-- Roll Number -->
                        <div class="mb-3">
                            <label for="roll" class="form-label">
                                Roll Number
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="roll"
                                name="roll"
                                value="{{ student[2] }}"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="semester" class="form-label">
                                Semester
                            </label>

                            <select
                                class="form-select"
                                id="semester"
                                name="semester"
                                required
                            >
                                <option value="">Select Semester</option>

                                <option value="1"
                                    {% if student[3]|string == "1" %}selected{% endif %}>
                                    1st Semester
                                </option>

                                <option value="2"
                                    {% if student[3]|string == "2" %}selected{% endif %}>
                                    2nd Semester
                                </option>

                                <option value="3"
                                    {% if student[3]|string == "3" %}selected{% endif %}>
                                    3rd Semester
                                </option>

                                <option value="4"
                                    {% if student[3]|string == "4" %}selected{% endif %}>
                                    4th Semester
                                </option>

                                <option value="5"
                                    {% if student[3]|string == "5" %}selected{% endif %}>
                                    5th Semester
                                </option>

                                <option value="6"
                                    {% if student[3]|string == "6" %}selected{% endif %}>
                                    6th Semester
                                </option>

                            </select>
                        </div>

                        <!-- Department -->
                        <div class="mb-4">
                            <label for="department" class="form-label">
                                Department
                            </label>

                            <select
                                class="form-select"
                                id="department"
                                name="department"
                                required
                            >
                                <option value="">Select Department</option>

                                <option value="Computer Science"
                                    {% if student[4] == "Computer Science" %}selected{% endif %}>
                                    Computer Science
                                </option>

                                <option value="BCA"
                                    {% if student[4] == "BCA" %}selected{% endif %}>
                                    BCA
                                </option>

                                <option value="Mathematics"
                                    {% if student[4] == "Mathematics" %}selected{% endif %}>
                                    Mathematics
                                </option>

                                <option value="Physics"
                                    {% if student[4] == "Physics" %}selected{% endif %}>
                                    Physics
                                </option>

                                <option value="Chemistry"
                                    {% if student[4] == "Chemistry" %}selected{% endif %}>
                                    Chemistry
                                </option>
                            </select>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="bi bi-check-circle"></i>
                                Update Student
                            </button>

                            <a
                                href="/dashboard1"
                                class="btn btn-secondary"
                            >
                                <i class="bi bi-arrow-left"></i>
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
