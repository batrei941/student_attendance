
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Registration</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #1565c0,
                    #42a5f5,
                    #90caf9
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }


        /* =========================
           Registration Card
        ========================= */

        .register-container {

            width: 100%;
            max-width: 520px;

            background: rgba(255, 255, 255, 0.98);

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.20);

        }


        /* =========================
           Header
        ========================= */

        .register-header {

            text-align: center;

            margin-bottom: 30px;

        }


        .register-icon {

            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e3f2fd;

            color: #1565c0;

            border-radius: 50%;

            font-size: 36px;

        }


        .register-header h2 {

            margin: 0;

            color: #1565c0;

            font-weight: 700;

        }


        .register-header p {

            margin-top: 8px;

            color: #777;

            font-size: 14px;

        }


        /* =========================
           Form Labels
        ========================= */

        .form-label {

            font-weight: 600;

            color: #333;

            margin-bottom: 7px;

        }


        /* =========================
           Inputs & Select
        ========================= */

        .form-control,
        .form-select {

            padding: 12px 14px;

            border-radius: 10px;

            border: 1px solid #d0d7de;

            font-size: 15px;

            transition: all 0.2s ease;

        }


        .form-control:focus,
        .form-select:focus {

            border-color: #1565c0;

            box-shadow:
                0 0 0 0.2rem rgba(21, 101, 192, 0.15);

        }


        /* =========================
           Input Icon
        ========================= */

        .input-group-text {

            background: #f1f7fd;

            border: 1px solid #d0d7de;

            color: #1565c0;

            border-radius: 10px 0 0 10px;

        }


        .input-group .form-control {

            border-radius: 0 10px 10px 0;

        }


        /* =========================
           Error
        ========================= */

        .error-text {

            display: block;

            color: #d32f2f;

            font-size: 13px;

            margin-top: 5px;

            min-height: 18px;

        }


        .error-input {

            border-color: #d32f2f !important;

            background-color: #fff8f8;

        }


        /* =========================
           Register Button
        ========================= */

        .register-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #1565c0,
                    #0d47a1
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            transition: all 0.2s ease;

        }


        .register-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(13, 71, 161, 0.30);

        }


        .register-btn:disabled {

            background: #90a4ae;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;

        }


        /* =========================
           Bottom Links
        ========================= */

        .bottom-links {

            text-align: center;

            margin-top: 25px;

            font-size: 14px;

        }


        .bottom-links a {

            color: #1565c0;

            text-decoration: none;

            font-weight: 600;

        }


        .bottom-links a:hover {

            text-decoration: underline;

        }


        .home-link {

            margin-top: 10px;

        }


        /* =========================
           Mobile
        ========================= */

        @media (max-width: 576px) {

            body {

                padding: 15px;

            }

            .register-container {

                padding: 25px 20px;

                border-radius: 16px;

            }

            .register-header h2 {

                font-size: 25px;

            }

            .register-icon {

                width: 65px;
                height: 65px;

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <!-- =========================
         Header
    ========================= -->

    <div class="register-header">

        <div class="register-icon">

            <i class="bi bi-person-badge-fill"></i>

        </div>

        <h2>Student  Registration</h2>

        <p>
            Create the Student  account to maintenace  the
            attendance management system.
        </p>

    </div>


    <!-- =========================
         Registration Form
    ========================= -->

    <form
        id="registerForm"
        action="/register"
        method="POST"
        novalidate>


        <!-- Student Name -->

        <div class="mb-3">

            <label
                for="t_name"
                class="form-label">

                Student Name

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-person-fill"></i>

                </span>


                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter Full Name"
                    value="{{ name or '' }}"
                    required>

            </div>


            <span
                class="error-text"
                id="nameError">
            </span>

        </div>


        <!-- roll 33-->

        <div class="mb-3">

            <label
                for="roll"
                class="form-label">

                Roll Number

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-envelope-fill"></i>

                </span>


                <input
                    type="text"
                    id="roll"
                    name="roll"
                    class="form-control"
                    placeholder="Enter student roll no."
                    value="{{ roll or '' }}"
                    required>

            </div>


            <span
                class="error-text"
                id="roll">

                {{ error or '' }}

            </span>

        </div>

        <!-- Semester -->

        <div class="mb-3">

            <label
                for="Semester"
                class="form-label">

                Semester

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-building"></i>

                </span>


                <select
                    id="semester"
                    name="semester"
                    class="form-select"
                    required>

                    <option value="">
                        -- Select Semester --
                    </option>


                    <option
                        value="Semester-I"
                        {% if department == "Semester-I" %}
                        selected
                        {% endif %}>

                        Semester-I

                    </option>


                    <option
                        value="Semester-II"
                        {% if department == "Semester-II" %}
                        selected
                        {% endif %}>

                        Semester-II

                    </option>


                    <option
                        value="Semester-III"
                        {% if department == "Semester-III" %}
                        selected
                        {% endif %}>

                        Semester-III

                    </option>


                    <option
                        value="Semester-IV"
                        {% if department == "Semester-IV" %}
                        selected
                        {% endif %}>

                        Semester-IV

                    </option>


                    <option
                        value="Semester-V"
                        {% if department == "Semester-V" %}
                        selected
                        {% endif %}>

                        Semester-V

                    </option>


                    <option
                        value="Semester-VI"
                        {% if department == "Semester-VI" %}
                        selected
                        {% endif %}>

                        Semester-VI

                    </option>


                    <option
                        value="Semester-VII"
                        {% if department == "Semester-VII" %}
                        selected
                        {% endif %}>

                        Semester-VII

                    </option>


                    <option
                        value="Semester-VIII"
                        {% if department == "Semester-VIII" %}
                        selected
                        {% endif %}>

                        Semester-VIII

                    </option>

                </select>

            </div>


            <span
                class="error-text"
                id="departmentError">
            </span>

        </div>

       


        <!-- Department -->

        <div class="mb-3">

            <label
                for="department"
                class="form-label">

                Department

            </label>


            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-building"></i>

                </span>


                <select
                    id="department"
                    name="department"
                    class="form-select"
                    required>

                    <option value="">
                        -- Select Department --
                    </option>


                    <option
                        value="Computer Application"
                        {% if department == "Computer Application" %}
                        selected
                        {% endif %}>

                        Computer Application

                    </option>


                    <option
                        value="Management"
                        {% if department == "Management" %}
                        selected
                        {% endif %}>

                        Management

                    </option>


                    <option
                        value="Physics"
                        {% if department == "Physics" %}
                        selected
                        {% endif %}>

                        Physics

                    </option>


                    <option
                        value="Chemistry"
                        {% if department == "Chemistry" %}
                        selected
                        {% endif %}>

                        Chemistry

                    </option>


                    <option
                        value="Mathematics"
                        {% if department == "Mathematics" %}
                        selected
                        {% endif %}>

                        Mathematics

                    </option>


                    <option
                        value="Botany"
                        {% if department == "Botany" %}
                        selected
                        {% endif %}>

                        Botany

                    </option>


                    <option
                        value="Zoology"
                        {% if department == "Zoology" %}
                        selected
                        {% endif %}>

                        Zoology

                    </option>


                    <option
                        value="Biochemistry"
                        {% if department == "Biochemistry" %}
                        selected
                        {% endif %}>

                        Biochemistry

                    </option>


                    <option
                        value="Political Science"
                        {% if department == "Political Science" %}
                        selected
                        {% endif %}>

                        Political Science

                    </option>


                    <option
                        value="Education"
                        {% if department == "Education" %}
                        selected
                        {% endif %}>

                        Education

                    </option>


                    <option
                        value="English"
                        {% if department == "English" %}
                        selected
                        {% endif %}>

                        English

                    </option>


                    <option
                        value="History"
                        {% if department == "History" %}
                        selected
                        {% endif %}>

                        History

                    </option>


                    <option
                        value="Philosophy"
                        {% if department == "Philosophy" %}
                        selected
                        {% endif %}>

                        Philosophy

                    </option>


                    <option
                        value="Economics"
                        {% if department == "Economics" %}
                        selected
                        {% endif %}>

                        Economics

                    </option>


                    <option
                        value="Sociology"
                        {% if department == "Sociology" %}
                        selected
                        {% endif %}>

                        Sociology

                    </option>


                    <option
                        value="Khasi"
                        {% if department == "Khasi" %}
                        selected
                        {% endif %}>

                        Khasi

                    </option>


                    <option
                        value="Bengali"
                        {% if department == "Bengali" %}
                        selected
                        {% endif %}>

                        Bengali

                    </option>


                    <option
                        value="Garo"
                        {% if department == "Garo" %}
                        selected
                        {% endif %}>

                        Garo

                    </option>

                </select>

            </div>


            <span
                class="error-text"
                id="departmentError">
            </span>

        </div>


        <!-- Register Button -->

        <div class="mt-4">

            <button
                type="submit"
                id="submitBtn"
                class="register-btn">

                <i class="bi bi-person-plus-fill me-2"></i>

                Add Student
            </button>

        </div>


    </form>


    <!-- =========================
         Bottom Links
    ========================= -->

    <div class="bottom-links">

        <div class="home-link">

            <a href="/dashboard">

                <i class="bi bi-arrow-left"></i>

                Back to Dashboard

            </a>

        </div>

    </div>


</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

const form = document.getElementById("registerForm");

const nameInput = document.getElementById("t_name");

const emailInput = document.getElementById("email");

const departmentInput =
    document.getElementById("department");

const nameError =
    document.getElementById("nameError");

const emailError =
    document.getElementById("emailError");

const departmentError =
    document.getElementById("departmentError");

const submitBtn =
    document.getElementById("submitBtn");


/* =========================
   Remove Error
========================= */

function clearError(input, errorElement) {

    input.classList.remove("error-input");

    errorElement.textContent = "";

}


/* =========================
   Show Error
========================= */

function setError(input, errorElement, message) {

    input.classList.add("error-input");

    errorElement.textContent = message;

}


/* =========================
   Form Validation
========================= */

form.addEventListener("submit", function(event) {

    let valid = true;


    /* Teacher Name */

    if (nameInput.value.trim() === "") {

        setError(
            nameInput,
            nameError,
            "Please enter teacher name."
        );

        valid = false;

    } else {

        clearError(
            nameInput,
            nameError
        );

    }


    /* Email */

    if (emailInput.value.trim() === "") {

        setError(
            emailInput,
            emailError,
            "Please enter email address."
        );

        valid = false;

    } else if (
        !emailInput.value.includes("@")
    ) {

        setError(
            emailInput,
            emailError,
            "Please enter a valid email address."
        );

        valid = false;

    } else {

        clearError(
            emailInput,
            emailError
        );

    }


    /* Department */

    if (departmentInput.value === "") {

        setError(
            departmentInput,
            departmentError,
            "Please select a department."
        );

        valid = false;

    } else {

        clearError(
            departmentInput,
            departmentError
        );

    }


    if (!valid) {

        event.preventDefault();

    }

});


/* =========================
   Clear Errors While Typing
========================= */

nameInput.addEventListener(
    "input",
    function() {

        clearError(
            nameInput,
            nameError
        );

    }
);


emailInput.addEventListener(
    "input",
    function() {

        clearError(
            emailInput,
            emailError
        );

    }
);


departmentInput.addEventListener(
    "change",
    function() {

        clearError(
            departmentInput,
            departmentError
        );

    }
);

</script>


</body>

</html>
